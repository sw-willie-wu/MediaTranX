services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-9001}:8001"
    volumes:
      - ./backend/app:/app/app        # 程式碼熱載入
      - mediatranx-data:/data          # 模型、設定持久化
    environment:
      - PYTHONUNBUFFERED=1
      - MEDIATRANX_HOME=/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src        # 程式碼熱載入
    environment:
      - VITE_BACKEND_URL=http://backend:8001
    depends_on:
      - backend

volumes:
  mediatranx-data:
