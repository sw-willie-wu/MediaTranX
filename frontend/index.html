<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaTranX</title>
    <script>
      // Set theme before CSS renders to avoid flash
      (function() {
        var saved = localStorage.getItem('theme-mode');
        var theme = (saved === 'light' || saved === 'dark') ? saved :
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root, [data-theme="dark"] {
        --splash-bg-start: #1f1c2c;
        --splash-bg-end: #4a4468;
        --splash-text: #ffffff;
        --splash-text-secondary: rgba(255, 255, 255, 0.7);
        --splash-text-tertiary: rgba(255, 255, 255, 0.5);
        --splash-track: rgba(255, 255, 255, 0.08);
        --splash-spin-start: #60a5fa;
        --splash-spin-end: #818cf8;
        /* App icon glyph (transparent SVG, follows splash theme) */
        --icon-wave-0: #f1eaff;
        --icon-wave-1: #a89cc8;
        --icon-film-0: #f5e6c8;
        --icon-film-1: #c8a87a;
        --icon-frame: #1a172a;
      }

      [data-theme="light"] {
        --splash-bg-start: #e8e8e8;
        --splash-bg-end: #b8b8db;
        --splash-text: #1a1a2e;
        --splash-text-secondary: rgba(0, 0, 0, 0.6);
        --splash-text-tertiary: rgba(0, 0, 0, 0.45);
        --splash-track: rgba(0, 0, 0, 0.08);
        --splash-spin-start: #3b82f6;
        --splash-spin-end: #6366f1;
        /* App icon glyph — deeper hues so it reads on the light splash */
        --icon-wave-0: #7c6fad;
        --icon-wave-1: #3d3460;
        --icon-film-0: #c8a06a;
        --icon-film-1: #846032;
        --icon-frame: #1a172a;
      }

      #splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: linear-gradient(to bottom, var(--splash-bg-start), var(--splash-bg-end));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 32px;
        transition: opacity 0.3s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #splash-overlay .logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        margin-bottom: 1.5rem;
      }
      #splash-overlay .title {
        font-size: 1.6rem;
        font-weight: 600;
        color: var(--splash-text);
        letter-spacing: 0.05em;
        margin-bottom: 2rem;
      }

      #splash-overlay .spinner-wrapper {
        position: relative;
        width: 64px;
        height: 64px;
        margin-bottom: 1rem;
      }
      #splash-overlay .spinner-track {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid var(--splash-track);
        position: absolute;
        inset: 0;
      }
      #splash-overlay .spinner-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: var(--splash-spin-start);
        border-right-color: var(--splash-spin-end);
        position: absolute;
        inset: 0;
        animation: splash-spin 1.2s linear infinite;
      }
      #splash-overlay .spinner-percent {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--splash-text);
      }

      #splash-overlay .status-area {
        width: 320px;
        text-align: center;
      }
      #splash-overlay .status-stage {
        font-size: 13px;
        color: var(--splash-text-secondary);
        margin-bottom: 6px;
        min-height: 1.4em;
      }
      #splash-overlay .status-detail {
        font-size: 12px;
        color: var(--splash-text-tertiary);
        margin-bottom: 6px;
        min-height: 1.4em;
      }

      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <!-- Material Symbols Outlined — used for the chat-bubble toggle in
         the titlebar (chat_bubble / chat_bubble_off). Subset to just the
         two icons we need so the font payload stays small. -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&text=chat_bubble_off" />
  </head>
  <body>

          <rect x="374.54" y="227" width="6" height="6" rx="1.5" fill="var(--icon-frame, #1a172a)" opacity="0.72"/>
          <rect x="374.54" y="279" width="6" height="6" rx="1.5" fill="var(--icon-frame, #1a172a)" opacity="0.72"/>
          <rect x="398.85" y="227" width="6" height="6" rx="1.5" fill="var(--icon-frame, #1a172a)" opacity="0.72"/>
          <rect x="398.85" y="279" width="6" height="6" rx="1.5" fill="var(--icon-frame, #1a172a)" opacity="0.72"/>

        </g>
        <g transform="rotate(45 256 256)">
          <rect x="87" y="245" width="18" height="22" rx="9" fill="url(#audio)"/>

          <rect x="407" y="245" width="18" height="22" rx="9" fill="url(#audio)"/>
        </g>
        <circle cx="256" cy="256" r="13" fill="#ffffff"/>
      </svg>
      <h1 class="title">MediaTranX</h1>
      <div class="spinner-wrapper">
        <div class="spinner-track"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-percent">100%</div>
      </div>
      <div class="status-area">
        <p class="status-stage">即將完成...</p>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
