<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaTranX</title>
    <script>
      // Set theme before CSS renders to avoid flash
      (function() {
        var saved = localStorage.getItem('theme-mode');
        var theme = (saved === 'light' || saved === 'dark') ? saved :
          (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root, [data-theme="dark"] {
        --splash-bg-start: #1f1c2c;
        --splash-bg-end: #4a4468;
        --splash-text: #ffffff;
        --splash-text-secondary: rgba(255, 255, 255, 0.7);
        --splash-text-tertiary: rgba(255, 255, 255, 0.5);
        --splash-track: rgba(255, 255, 255, 0.08);
        --splash-spin-start: #60a5fa;
        --splash-spin-end: #818cf8;
      }

      [data-theme="light"] {
        --splash-bg-start: #e8e8e8;
        --splash-bg-end: #b8b8db;
        --splash-text: #1a1a2e;
        --splash-text-secondary: rgba(0, 0, 0, 0.6);
        --splash-text-tertiary: rgba(0, 0, 0, 0.45);
        --splash-track: rgba(0, 0, 0, 0.08);
        --splash-spin-start: #3b82f6;
        --splash-spin-end: #6366f1;
      }

      #splash-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: linear-gradient(to bottom, var(--splash-bg-start), var(--splash-bg-end));
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 32px;
        transition: opacity 0.3s ease;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      #splash-overlay .logo {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        margin-bottom: 1.5rem;
      }
      #splash-overlay .title {
        font-size: 1.6rem;
        font-weight: 600;
        color: var(--splash-text);
        letter-spacing: 0.05em;
        margin-bottom: 2rem;
      }

      #splash-overlay .spinner-wrapper {
        position: relative;
        width: 64px;
        height: 64px;
        margin-bottom: 1rem;
      }
      #splash-overlay .spinner-track {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid var(--splash-track);
        position: absolute;
        inset: 0;
      }
      #splash-overlay .spinner-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-top-color: var(--splash-spin-start);
        border-right-color: var(--splash-spin-end);
        position: absolute;
        inset: 0;
        animation: splash-spin 1.2s linear infinite;
      }
      #splash-overlay .spinner-percent {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: 600;
        color: var(--splash-text);
      }

      #splash-overlay .status-area {
        width: 320px;
        text-align: center;
      }
      #splash-overlay .status-stage {
        font-size: 13px;
        color: var(--splash-text-secondary);
        margin-bottom: 6px;
        min-height: 1.4em;
      }
      #splash-overlay .status-detail {
        font-size: 12px;
        color: var(--splash-text-tertiary);
        margin-bottom: 6px;
        min-height: 1.4em;
      }

      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash-overlay">
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1f1c2c"/><stop offset="100%" stop-color="#928dab"/>
          </linearGradient>
          <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a89cc8"/><stop offset="100%" stop-color="#7c6fad"/>
          </linearGradient>
        </defs>
        <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>
        <path d="M228 218 L228 294 L300 256 Z" fill="url(#accent)"/>
      </svg>
      <h1 class="title">MediaTranX</h1>
      <div class="spinner-wrapper">
        <div class="spinner-track"></div>
        <div class="spinner-ring"></div>
        <div class="spinner-percent">100%</div>
      </div>
      <div class="status-area">
        <p class="status-stage">即將完成...</p>
        <p class="status-detail"></p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
