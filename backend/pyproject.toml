[project]
name = "mediatranx-backend"
version = "1.5.0"
description = "MediaTranX Backend with FastAPI, Sidecar AI Support"
requires-python = "~=3.12.0"
dependencies = [
    # Core Framework (Always bundled in core.exe)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "dependency-injector>=4.41.0",
    # Base Utilities
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "Pillow>=10.2.0",
    "ffmpeg-python>=0.2.0",
    "requests>=2.31.0",
    "tzdata",
    "pypdf>=6.8.0",
    "python-docx>=1.2.0",
    "pypdfium2>=4.30.0",
    "sqlmodel>=0.0.22",
    "mido>=1.3.0",
    # --- Inference Runtimes ---
    # torch / torchvision 由 setup 依硬體偵測另外安裝（CPU / CUDA），不列入 lock
    "ctranslate2>=4.7.1",
    "onnxruntime>=1.17.0",
    # --- Media Processing Libraries ---
    "faster-whisper>=1.2.1",
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
    "facexlib>=0.3.0",
    "gfpgan>=1.3.8",
    "rembg>=2.0.50",
    "spandrel>=0.3.0",
    "timm>=1.0.0",
    "mobile-sam @ https://github.com/sw-willie-wu/MediaTranX/releases/download/vendored-deps/mobile_sam-b01a9cc.tar.gz",
    "simple-lama-inpainting",
    # --- Audio ---
    "soundfile>=0.12.0",
    "demucs",
    # --- Alignment ---
    "transformers>=4.40.0",
    # --- Download & Utils ---
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
    "einops>=0.7.0",
    # --- MIDI Features ---
    "basic-pitch>=0.3.0",
    "setuptools<81", # basic-pitch -> resampy -> pkg_resources（setuptools 82 移除了）
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "opencc-python-reimplemented>=0.1.7",
    "scenedetect>=0.6.7.1",
    "opencv-python",
    "ag-ui-protocol==0.1.18",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ai: tests requiring GPU and AI models (skip in CI)",
    "ffmpeg: tests requiring ffmpeg binary",
]

[tool.coverage.run]
source = ["app"]
# Exclude site-packages — coverage instrumentation breaks torch's _add_docstr (which
# rejects re-docstring-ing). Keep tracing limited to first-party `app/` code.
omit = [
    "app/main.py",
    "app/init/*",
    "app/adapters/device.py",
    "app/adapters/ai/wrapper/rife_arch.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.uv]
managed = true
# basic-pitch 拉入 tensorflow，但我們只用 ONNX 後端（已有 onnxruntime）
# tensorflow-io-gcs-filesystem 沒有 Windows wheel，必須排除整個 TF
override-dependencies = [
    "tensorflow ; python_version < '3.0'",
    "tensorflow-io-gcs-filesystem ; python_version < '3.0'",
    # demucs (GitHub) pins torchaudio<2.1，但 Python 3.12 無 2.0.x wheel，強制放寬
    "torchaudio>=2.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# --- AUTO-GENERATED TORCH SOURCES (do not edit manually) ---
[tool.uv.sources]
demucs = { url = "https://github.com/sw-willie-wu/MediaTranX/releases/download/vendored-deps/demucs-e976d93.tar.gz" }
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
# --- END AUTO-GENERATED ---
