[project]
name = "mediatranx-backend"
version = "1.2.0"
description = "MediaTranX Backend with FastAPI, Sidecar AI Support"
requires-python = "~=3.12.0"
dependencies = [
    # Core Framework (Always bundled in core.exe)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Base Utilities
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.6",
    "Pillow>=10.2.0",
    "ffmpeg-python>=0.2.0",
    "requests>=2.31.0",
    "tzdata",
    "pypdf>=6.8.0",
    "python-docx>=1.2.0",
    "pypdfium2>=4.30.0",
    "sqlmodel>=0.0.22",
    "mido>=1.3.0",
]

[project.optional-dependencies]
# AI Extensions (Downloaded on-demand via uv)
ai = [
    # --- Inference Runtimes ---
    # torch / torchvision 由 setup 依硬體偵測另外安裝（CPU / CUDA），不列入 lock
    "ctranslate2>=4.7.1",
    "onnxruntime>=1.17.0",
    # --- Media Processing Libraries ---
    "faster-whisper>=1.2.1",
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
    "facexlib>=0.3.0",
    "gfpgan>=1.3.8",
    "rembg>=2.0.50",
    "spandrel>=0.3.0",
    "timm>=1.0.0",
    "mobile-sam @ git+https://github.com/ChaoningZhang/MobileSAM.git",
    "simple-lama-inpainting",
    # --- Audio ---
    "soundfile>=0.12.0",
    "demucs>=4.0.0",
    # --- Alignment ---
    "transformers>=4.40.0",

    # --- Download & Utils ---
    "huggingface-hub>=0.20.0",
    "tqdm>=4.66.0",
    "einops>=0.7.0",
    # --- MIDI Features ---
    "basic-pitch>=0.3.0",
    "pyfluidsynth>=1.3.0",
]

[tool.uv]
managed = true
# basic-pitch 強制依賴 tensorflow (py>=3.11)，但我們用 ONNX 後端（已有 onnxruntime）
override-dependencies = [
    "tensorflow ; python_version < '3.0'",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
