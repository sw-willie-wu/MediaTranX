<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Dark (default) */
    :root, [data-theme="dark"] {
      --bg-start: #1f1c2c;
      --bg-end: #4a4468;
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.5);
      --spin-track: rgba(255, 255, 255, 0.08);
      --spin-start: #60a5fa;
      --spin-end: #818cf8;
      /* App icon glyph (transparent SVG, follows splash theme) */
      --icon-wave-0: #f1eaff;
      --icon-wave-1: #a89cc8;
      --icon-film-0: #f5e6c8;
      --icon-film-1: #c8a87a;
      --icon-frame: #1a172a;
    }

    /* Light */
    [data-theme="light"] {
      --bg-start: #e8e8e8;
      --bg-end: #b8b8db;
      --text-primary: #1a1a2e;
      --text-secondary: rgba(0, 0, 0, 0.6);
      --text-tertiary: rgba(0, 0, 0, 0.45);
      --spin-track: rgba(0, 0, 0, 0.08);
      --spin-start: #3b82f6;
      --spin-end: #6366f1;
      /* App icon glyph — deeper hues so it reads on the light splash */
      --icon-wave-0: #7c6fad;
      --icon-wave-1: #3d3460;
      --icon-film-0: #c8a06a;
      --icon-film-1: #846032;
      --icon-frame: #1a172a;
    }

    body {
      background: linear-gradient(to bottom, var(--bg-start), var(--bg-end));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      padding-bottom: 32px; /* Offset for frameless window titlebar */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      margin-bottom: 1.5rem;
    }

    .title {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }

    /* Spinner ring with percentage inside */
    .spinner-wrapper {
      position: relative;
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
    }

    .spinner-track {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid var(--spin-track);
      position: absolute;
      inset: 0;
    }

    .spinner-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--spin-start);
      border-right-color: var(--spin-end);
      position: absolute;
      inset: 0;
      animation: spin 1.2s linear infinite;
    }

    .spinner-percent {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Status texts below spinner */
    .status-area {
      text-align: center;
      width: 320px;
    }

    .status-stage {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
      min-height: 1.4em;
    }

    .status-detail {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
      min-height: 1.4em;
    }


    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
