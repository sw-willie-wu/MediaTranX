<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root, [data-theme="dark"] { --bg-start:#1f1c2c; --bg-end:#4a4468; --text:#fff; --sub:rgba(255,255,255,.7); --btn:#60a5fa; --btn-text:#0b1020; }
    [data-theme="light"] { --bg-start:#e8e8e8; --bg-end:#b8b8db; --text:#1a1a2e; --sub:rgba(0,0,0,.6); --btn:#3b82f6; --btn-text:#fff; }
    body { background:linear-gradient(to bottom,var(--bg-start),var(--bg-end)); height:100vh;
           display:flex; flex-direction:column; align-items:center; justify-content:center;
           font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; -webkit-app-region:drag; padding-bottom:32px; }
    h1 { color:var(--text); font-size:1.3rem; margin-bottom:.75rem; }
    p { color:var(--sub); font-size:.9rem; margin-bottom:1.5rem; text-align:center; max-width:380px; line-height:1.5; }
    button { -webkit-app-region:no-drag; background:var(--btn); color:var(--btn-text); border:none;
             border-radius:10px; padding:10px 28px; font-size:.95rem; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <h1 id="title">應用程式發生問題</h1>
  <p id="message">畫面無法自動恢復。請點擊重試以重新啟動應用程式。</p>
  <button id="retry" onclick="window.electron && window.electron.restart && window.electron.restart()">重試</button>
  <!-- theme + localized strings injected by showErrorUI() after load -->
</body>
</html>
